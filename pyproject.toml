[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwops"
version = "0.1.0"
description = "Claude Workspace Ops MCP - least-privilege, approval-gated Google Drive automation over MCP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "anthropic>=0.40",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.35",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
cwops = "cwops.cli:main"
cwops-mcp = "cwops.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The demo seed ships with the package: CWOPS_DRIVE_BACKEND=fake is a supported
# runtime mode, not only a test double.
cwops = ["drive/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Project-local tmp dir: the default under %TEMP% is not always writable on
# locked-down Windows profiles, and a repo-local path keeps runs reproducible.
addopts = "-q --basetemp=.pytest-tmp"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/cwops"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["cwops"]
